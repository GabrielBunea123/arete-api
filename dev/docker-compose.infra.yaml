services:
  postgres:
    image: postgres:17
    container_name: arete-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-arete}
      POSTGRES_USER: ${DB_USERNAME:-arete}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arete}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - arete-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arete-postgres-data:
