openapi: 3.0.3
info:
  title: Arete API - users
  description: The signed-in user's own account.
  version: 1.0.0

servers:
  - url: /api/v1

security:
  - cookieAuth: []

paths:
  /me:
    get:
      tags: [User]
      summary: Get the signed-in user
      description: Returns the account of the caller identified by the access token cookie.
      operationId: getMe
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
    put:
      tags: [User]
      summary: Update the signed-in user's profile
      description: Replaces the editable profile fields of the caller's account. Email and roles can't be changed here.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  schemas:
    UserResponse:
      type: object
      required: [id, email, fullName, emailVerified, roles, providers, passwordSet]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: jane.doe@example.com
        fullName:
          type: string
          example: Jane Doe
        emailVerified:
          type: boolean
          example: true
        passwordSet:
          type: boolean
          description: Whether the account can sign in with email and password.
          example: false
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        providers:
          type: array
          description: External sign-in providers linked to the account.
          items:
            $ref: '#/components/schemas/AuthProvider'

    UpdateUserRequest:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Jane Doe

    Role:
      type: string
      enum: [USER, ADMIN]

    AuthProvider:
      type: string
      enum: [GOOGLE]
