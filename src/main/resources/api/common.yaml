openapi: 3.0.3
info:
  title: Arete API - shared components
  description: Error model and reusable responses referenced by every other spec file.
  version: 1.0.0

paths: {}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived access JWT, set as an HttpOnly cookie by the auth endpoints.

  headers:
    SetAuthCookies:
      description: >
        Sets the HttpOnly `access_token` cookie (short-lived JWT) and the HttpOnly
        `refresh_token` cookie (long-lived, path-scoped to `/auth`, rotated on every refresh).
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller is authenticated but not allowed to do this, or the CSRF token is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource doesn't exist or isn't owned by the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many attempts; retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Email is already in use
        instance:
          type: string
          format: uri
          example: /api/v1/auth/register
        errors:
          type: object
          description: Validation errors by field name, present only on request validation failures.
          additionalProperties:
            type: string
